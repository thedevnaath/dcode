<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>apophenia</title>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        /* 1. MAIN BACKGROUND & CRT OVERLAY */
        body {
            background-color: #030303;
            color: #d0d0d0;
            font-family: 'Courier New', Courier, monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* CRT Scanlines Effect */
        body::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 99;
            background-size: 100% 3px, 6px 100%;
            pointer-events: none;
            opacity: 0.85;
        }

        /* 2. CSS SMOKE EFFECT BACKGROUND */
        .smoke-wrapper {
            position: fixed;
            width: 600px;
            height: 600px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
            opacity: 0.35;
            filter: blur(8px);
        }

        .smoke-particle {
            border: 2px solid rgba(139, 0, 0, 0.2);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform-origin: center center;
            animation: spin 6s linear infinite;
        }

        /* Generated Smoke Ring Layers */
        .smoke-particle:nth-child(1) { width: 120px; height: 100px; box-shadow: 6px 0px rgba(139,0,0,0.5), 12px -10px rgba(10,0,0,0.8); animation-duration: 4s; }
        .smoke-particle:nth-child(2) { width: 180px; height: 150px; box-shadow: 10px 0px rgba(160,0,0,0.4), 18px -12px rgba(20,0,0,0.8); animation-duration: 7s; }
        .smoke-particle:nth-child(3) { width: 240px; height: 200px; box-shadow: 14px 0px rgba(139,0,0,0.4), 24px -15px rgba(10,0,0,0.8); animation-duration: 9s; }
        .smoke-particle:nth-child(4) { width: 300px; height: 250px; box-shadow: 18px 0px rgba(180,0,0,0.3), 30px -18px rgba(30,0,0,0.8); animation-duration: 12s; }
        .smoke-particle:nth-child(5) { width: 360px; height: 300px; box-shadow: 22px 0px rgba(139,0,0,0.3), 36px -20px rgba(10,0,0,0.8); animation-duration: 15s; }

        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* 3. DESKTOP MAIN TERMINAL LAYOUT */
        .terminal-container {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 40px;
            max-width: 900px;
            width: 100%;
        }

        /* TOP RIGHT: ONLINE COUNTER */
        .top-right-online {
            position: fixed;
            top: 25px;
            right: 35px;
            font-size: 0.85rem;
            color: #888;
            letter-spacing: 1.5px;
            z-index: 100;
        }

        /* BOTTOM RIGHT: HELP NODE (?) */
        .help-node {
            position: fixed;
            bottom: 25px;
            right: 35px;
            width: 28px;
            height: 28px;
            border: 1px solid #4a1515;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.8rem;
            color: #a00000;
            cursor: pointer;
            z-index: 100;
            transition: all 0.2s ease;
        }

        .help-node:hover {
            border-color: #ff1a1a;
            color: #ff1a1a;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.4);
        }

        /* LEFT SIDE PANEL BOX */
        .side-panel {
            border: 1px solid #222;
            border-top: 1px solid #4a1515;
            background-color: rgba(10, 10, 10, 0.85);
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-width: 110px;
            text-align: center;
            border-radius: 2px;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
        }

        .side-item {
            font-size: 1.1rem;
            letter-spacing: 2px;
            color: #888;
            font-weight: bold;
        }

        .side-item.highlight {
            color: #a00000;
        }

        /* CENTER MAIN PANEL */
        .center-panel {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* TITLE & NODE TOGGLES (A0 / A1) */
        .title-group {
            margin-bottom: 20px;
        }

        .main-title {
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 6px;
            color: #a00000;
            text-transform: uppercase;
            text-shadow: 0 0 12px rgba(160, 0, 0, 0.8);
            margin-bottom: 10px;
        }

        .nodes-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .node-badge {
            border: 1px solid #333;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            color: #aaa;
            letter-spacing: 1px;
            background: rgba(15, 15, 15, 0.9);
        }

        .node-line {
            height: 1px;
            width: 40px;
            background-color: #333;
        }

        /* SECONDS DISPLAY */
        .seconds-display {
            font-size: 4.5rem;
            font-weight: bold;
            color: #f0f0f0;
            letter-spacing: 4px;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
            margin-bottom: 30px;
            font-family: monospace;
        }

        /* 12 INPUT CODE BOXES */
        .code-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 6px;
            width: 100%;
            max-width: 580px;
            margin-bottom: 12px;
        }

        .code-box {
            background-color: rgba(10, 10, 10, 0.95);
            border: 1px solid #222;
            border-top: 1px solid #4a1515;
            color: #ff1a1a;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
            padding: 12px 0;
            border-radius: 2px;
            outline: none;
            width: 100%;
        }

        .code-box:focus {
            border-color: #8b0000;
            box-shadow: 0 0 8px rgba(139, 0, 0, 0.7);
            background-color: rgba(25, 10, 10, 0.95);
            color: #ffffff;
        }

        /* SUBTEXT ATTEMPTS */
        .attempts-subtext {
            font-size: 0.8rem;
            color: #777;
            letter-spacing: 1px;
            margin-top: 5px;
        }

        /* STATUS MESSAGES */
        .status-bar {
            margin-top: 35px;
            font-size: 0.75rem;
            color: #7a0000;
            letter-spacing: 1.5px;
            text-transform: lowercase;
        }

        body.flash-red {
            background-color: #300000 !important;
        }

        /* RESPONSIVE ADJUSTMENTS */
        @media (max-width: 768px) {
            .terminal-container {
                flex-direction: column;
                gap: 20px;
            }
            .side-panel {
                flex-direction: row;
                width: 100%;
                justify-content: space-around;
            }
            .seconds-display {
                font-size: 2.8rem;
            }
            .main-title {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body id="body-target">

    <!-- TOP RIGHT ONLINE COUNTER -->
    <div class="top-right-online" id="online-counter">106 Online</div>

    <!-- BOTTOM RIGHT HELP BUTTON -->
    <div class="help-node" onclick="alert('DECODE THE 12-DIGIT SEQUENCE. SIGNAL ACTIVE.')">?</div>

    <!-- BACKGROUND CSS SMOKE EFFECT -->
    <div class="smoke-wrapper">
        <div class="smoke-particle"></div>
        <div class="smoke-particle"></div>
        <div class="smoke-particle"></div>
        <div class="smoke-particle"></div>
        <div class="smoke-particle"></div>
    </div>

    <!-- MAIN TERMINAL LAYOUT -->
    <div class="terminal-container">
        
        <!-- LEFT SIDE METADATA PANEL -->
        <div class="side-panel">
            <div class="side-item">1940</div>
            <div class="side-item">10</div>
            <div class="side-item">6</div>
            <div class="side-item highlight">D-X</div>
        </div>

        <!-- CENTER MAIN PANEL -->
        <div class="center-panel">
            
            <div class="title-group">
                <h1 class="main-title">APOPHENIA</h1>
            </div>

            <div class="nodes-container">
                <div class="node-badge">A0</div>
                <div class="node-line"></div>
                <div class="node-badge">A1</div>
            </div>

            <!-- SECONDS TIMER -->
            <div class="seconds-display" id="seconds-display">9157321</div>

            <!-- 12 CODE INPUT BOXES -->
            <div class="code-grid">
                <input type="text" class="code-box" maxlength="1" inputmode="numeric" pattern="[0-9]*">
                <input type="text" class="code-box" maxlength="1" inputmode="numeric" pattern="[0-9]*">
                <input type="text" class="code-box" maxlength="1" inputmode="numeric" pattern="[0-9]*">
                <input type="text" class="code-box" maxlength="1" inputmode="numeric" pattern="[0-9]*">
                <input type="text" class="code-box" maxlength="1" inputmode="numeric" pattern="[0-9]*">
                <input type="text" class="code-box" maxlength="1" inputmode="numeric" pattern="[0-9]*">
                <input type="text" class="code-box" maxlength="1" inputmode="numeric" pattern="[0-9]*">
                <input type="text" class="code-box" maxlength="1" inputmode="numeric" pattern="[0-9]*">
                <input type="text" class="code-box" maxlength="1" inputmode="numeric" pattern="[0-9]*">
                <input type="text" class="code-box" maxlength="1" inputmode="numeric" pattern="[0-9]*">
                <input type="text" class="code-box" maxlength="1" inputmode="numeric" pattern="[0-9]*">
                <input type="text" class="code-box" maxlength="1" inputmode="numeric" pattern="[0-9]*">
            </div>

            <!-- SUBTEXT ATTEMPTS -->
            <div class="attempts-subtext" id="attempts-text">you have 3 attempts today</div>

            <!-- SYSTEM STATUS -->
            <div class="status-bar" id="status-text">system synchronized // network live</div>

        </div>

    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        let targetTime = 0;
        let timeOffset = 0;
        let remainingAttempts = 3;

        // Fetch Server Time & Live Online Count from API
        async function fetchServerState() {
            try {
                const res = await fetch('/api/time');
                const data = await res.json();
                
                targetTime = data.targetTimestamp;
                timeOffset = data.serverTime - Date.now();

                const count = data.onlineCount || 106;
                document.getElementById('online-counter').innerText = `${count} Online`;
                
                updateTimer();
            } catch (err) {
                // Default fallback timer if offline
                if (!targetTime) targetTime = Date.now() + (9157321 * 1000);
                updateTimer();
            }
        }

        // Ticking Seconds Timer
        function updateTimer() {
            if (!targetTime) return;

            const now = Date.now() + timeOffset;
            const diff = targetTime - now;

            if (diff <= 0) {
                document.getElementById('seconds-display').innerText = "0";
                document.getElementById('status-text').innerText = "null state reached.";
                return;
            }

            const totalSeconds = Math.floor(diff / 1000);
            document.getElementById('seconds-display').innerText = totalSeconds.toString();
        }

        fetchServerState();
        setInterval(updateTimer, 1000);

        // 12 CODE INPUT BOXES CONTROLLER
        const codeInputs = document.querySelectorAll('.code-box');

        codeInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                input.value = input.value.replace(/[^0-9]/g, ''); // Numbers only
                
                if (input.value.length === 1 && index < codeInputs.length - 1) {
                    codeInputs[index + 1].focus(); // Auto jump to next box
                }

                // Auto submit when 12th box is filled
                if (index === codeInputs.length - 1 && input.value.length === 1) {
                    checkSubmission();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && input.value === '' && index > 0) {
                    codeInputs[index - 1].focus();
                }
            });
        });

        function checkSubmission() {
            if (remainingAttempts <= 0) return;

            remainingAttempts--;
            const attemptEl = document.getElementById('attempts-text');
            
            if (remainingAttempts > 0) {
                attemptEl.innerText = `you have ${remainingAttempts} attempts today`;
            } else {
                attemptEl.innerText = `0 attempts remaining // locked until tomorrow`;
                codeInputs.forEach(i => i.disabled = true);
            }
        }

        // EASTER EGG KEYBOARD LISTENER
        let inputBuffer = "";
        const secrets = {
            "TRUTH": () => triggerEasterEgg("TRUTH DETECTED: THERE IS NO ESCAPE", true),
            "GATE": () => triggerEasterEgg("GATEWAY OPENING // LOGS UNLOCKED", false),
            "WAKE": () => triggerEasterEgg("YOU CANNOT WAKE UP", true)
        };

        window.addEventListener('keydown', (e) => {
            if (e.key.length === 1 && e.key.match(/[a-z]/i)) {
                inputBuffer += e.key.toUpperCase();
                if (inputBuffer.length > 10) inputBuffer = inputBuffer.substring(inputBuffer.length - 10);
                
                for (let code in secrets) {
                    if (inputBuffer.endsWith(code)) {
                        secrets[code]();
                        inputBuffer = "";
                    }
                }
            }
        });

        function triggerEasterEgg(message, flashEffect) {
            const statusEl = document.getElementById('status-text');
            statusEl.innerText = message;
            statusEl.style.color = "#ff1a1a";

            if (flashEffect) {
                document.body.classList.add('flash-red');
                setTimeout(() => document.body.classList.remove('flash-red'), 300);
            }
        }
    </script>
</body>
</html>
