<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>apophenia</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #120b17;
            color: #d0d0d0;
            font-family: 'Courier New', Courier, monospace;
            min-height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 1. CRT SCANLINES OVERLAY */
        body::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 99;
            background-size: 100% 3px, 6px 100%;
            pointer-events: none;
            opacity: 0.85;
        }

        /* 2. EXACT CODEPEN CSS SMOKE EFFECT BACKGROUND */
        .smoke-container {
            position: fixed;
            width: 500px;
            height: 500px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
            border-radius: 50%;
            opacity: 0.6;
        }

        .smoke-container .c {
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 400px;
            position: absolute;
            margin: auto;
            top: 0; left: 0; right: 0; bottom: 0;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 3. PINNED CORNER ELEMENTS (EXACT MATCH TO DRAWING) */
        
        /* TOP LEFT: ONLINE COUNTER */
        .corner-top-left {
            position: fixed;
            top: 30px;
            left: 35px;
            font-size: 0.85rem;
            color: #aaaaaa;
            letter-spacing: 1px;
            z-index: 10;
        }

        /* TOP RIGHT: HELP NODE (?) */
        .corner-top-right {
            position: fixed;
            top: 25px;
            right: 35px;
            width: 30px;
            height: 30px;
            border: 1px solid #666;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.85rem;
            color: #cccccc;
            cursor: pointer;
            z-index: 10;
            transition: all 0.2s ease;
        }

        .corner-top-right:hover {
            border-color: #ff1a1a;
            color: #ff1a1a;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.4);
        }

        /* BOTTOM LEFT: METADATA BOX */
        .corner-bottom-left {
            position: fixed;
            bottom: 30px;
            left: 35px;
            border: 1px solid #333333;
            background-color: rgba(10, 10, 10, 0.75);
            padding: 12px 18px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 90px;
            text-align: left;
            border-radius: 2px;
            z-index: 10;
            box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.8);
        }

        .meta-item {
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            color: #888888;
        }

        /* 4. MAIN CENTER STACK */
        .main-center-stack {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            max-width: 650px;
            padding: 0 15px;
        }

        /* TITLE */
        .title-apophenia {
            font-size: clamp(2rem, 6vw, 3.2rem);
            font-weight: 500;
            letter-spacing: 8px;
            color: #e0e0e0;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        /* CONNECTED LEVEL PROGRESS BAR */
        .nodes-wrapper {
            position: relative;
            width: 100vw; /* Breaks out of container to span full screen */
            left: 50%;
            transform: translateX(-50%);
            height: 50px;
            margin-bottom: 25px;
            display: block;
        }

        .node-line-bg {
            position: absolute;
            top: 12px;
            left: 50%; /* Starts exactly at A0 in the center */
            width: 50vw; /* Extends exactly to the right edge of the screen */
            height: 1px;
            background-color: #555555;
            z-index: 1;
            transition: left 0.8s ease-in-out, width 0.8s ease-in-out;
        }

        .nodes-container {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        .node-item {
            position: absolute;
            top: 0;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: left 0.8s ease-in-out; /* Smooth slide for when levels change */
        }

        .node-item.pos-center {
            left: 50%; /* Center of the screen */
        }

        .node-item.pos-right {
            left: 75%; /* Exactly between center and right edge */
        }

        .node-item.pos-left {
            left: 25%; /* Where A0 will move to when solved */
        }

        .node-circle {
            border: 1px solid #666666;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            letter-spacing: 1px;
            background: #120b17;
            color: #aaaaaa;
            transition: all 0.5s ease;
        }

        /* Current active level styling (Red border & text) */
        .node-circle.current {
            border-color: #ff1a1a;
            color: #ff1a1a;
            box-shadow: 0 0 8px rgba(255, 26, 26, 0.5);
        }

        /* Completed level styling (Green border & text) */
        .node-circle.completed {
            border-color: #00ff66;
            color: #00ff66;
            box-shadow: 0 0 8px rgba(0, 255, 102, 0.5);
        }

        /* Level name below active level */
        .level-name {
            margin-top: 5px;
            font-size: 0.75rem;
            color: #ff1a1a;
            letter-spacing: 1px;
            text-transform: lowercase;
            transition: color 0.5s ease;
        }

        /* SECONDS TIMER DISPLAY */
        .seconds-display {
            font-size: clamp(3rem, 10vw, 5.5rem);
            font-weight: 300;
            color: #ffffff;
            letter-spacing: 6px;
            margin-bottom: 30px;
            font-family: monospace;
        }

        /* 12 INPUT CODE BOXES */
        .code-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 6px;
            width: 100%;
            margin-bottom: 15px;
        }

        .code-box {
            background-color: rgba(10, 10, 10, 0.85);
            border: 1px solid #444444;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.1rem;
            font-weight: bold;
            text-align: center;
            padding: 10px 0;
            border-radius: 2px;
            outline: none;
            width: 100%;
        }

        .code-box:focus {
            border-color: #8b0000;
            box-shadow: 0 0 8px rgba(139, 0, 0, 0.7);
            background-color: rgba(25, 10, 10, 0.95);
        }

        /* SUBTEXT ATTEMPTS */
        .attempts-subtext {
            font-size: 0.8rem;
            color: #888888;
            letter-spacing: 1px;
        }

        .status-bar {
            margin-top: 35px;
            font-size: 0.75rem;
            color: #7a0000;
            letter-spacing: 1.5px;
            text-transform: lowercase;
        }

        body.flash-red {
            background-color: #300000 !important;
        }
    </style>
</head>
<body id="body-target">

    <!-- SVG BLUR FILTER FOR SMOKE -->
    <svg version="1.1" xmlns="http://www.w3.org/2000/svg" style="display:none;">
        <filter id="blur">
            <feGaussianBlur stdDeviation="10" />
        </filter>
    </svg>

    <!-- SMOKE EFFECT BACKGROUND CONTAINER -->
    <div class="smoke-container" id="smoke-box"></div>

    <!-- 1. TOP LEFT: ONLINE COUNTER -->
    <div class="corner-top-left" id="online-counter">106 Online</div>

    <!-- 2. TOP RIGHT: HELP NODE -->
    <div class="corner-top-right" onclick="alert('DECODE THE 12-DIGIT SEQUENCE.')">?</div>

    <!-- 3. BOTTOM LEFT: METADATA BOX -->
    <div class="corner-bottom-left">
        <div class="meta-item">1940</div>
        <div class="meta-item">10</div>
        <div class="meta-item">6</div>
        <div class="meta-item">D-X</div>
    </div>

    <!-- 4. CENTER MAIN TERMINAL STACK -->
    <div class="main-center-stack">
        
        <h1 class="title-apophenia">APOPHENIA</h1>

        <div class="nodes-wrapper">
            <div class="node-line-bg"></div>
            <div class="nodes-container">
                <!-- A0 centered (Current Level with Red Border & Name) -->
                <div class="node-item pos-center">
                    <div class="node-circle current">A0</div>
                    <div class="level-name">centipede</div>
                </div>
                <!-- A1 at Right (Locked Level) -->
                <div class="node-item pos-right">
                    <div class="node-circle">A1</div>
                </div>
            </div>
        </div>

        <!-- SECONDS DISPLAY -->
        <div class="seconds-display" id="seconds-display">9157321</div>

        <!-- 12 CODE INPUT BOXES -->
        <div class="code-grid">
            <input type="text" class="code-box" maxlength="1" inputmode="numeric" pattern="[0-9]*">
            <input type="text" class="code-box" maxlength="1" inputmode="numeric" pattern="[0-9]*">
            <input type="text" class="code-box" maxlength="1" inputmode="numeric" pattern="[0-9]*">
            <input type="text" class="code-box" maxlength="1" inputmode="numeric" pattern="[0-9]*">
            <input type="text" class="code-box" maxlength="1" inputmode="numeric" pattern="[0-9]*">
            <input type="text" class="code-box" maxlength="1" inputmode="numeric" pattern="[0-9]*">
            <input type="text" class="code-box" maxlength="1" inputmode="numeric" pattern="[0-9]*">
            <input type="text" class="code-box" maxlength="1" inputmode="numeric" pattern="[0-9]*">
            <input type="text" class="code-box" maxlength="1" inputmode="numeric" pattern="[0-9]*">
            <input type="text" class="code-box" maxlength="1" inputmode="numeric" pattern="[0-9]*">
            <input type="text" class="code-box" maxlength="1" inputmode="numeric" pattern="[0-9]*">
            <input type="text" class="code-box" maxlength="1" inputmode="numeric" pattern="[0-9]*">
        </div>

        <!-- SUBTEXT ATTEMPTS -->
        <div class="attempts-subtext" id="attempts-text">you have 3 attempts today</div>

        <!-- STATUS BAR -->
        <div class="status-bar" id="status-text">system synchronized // network live</div>

    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // GENERATE THE 60-RING CODEPEN CSS SMOKE EFFECT AUTOMATICALLY
        const smokeBox = document.getElementById('smoke-box');
        for (let i = 1; i <= 60; i++) {
            const circle = document.createElement('div');
            circle.className = 'c';
            
            const alpha = 1 - (i / 80);
            const shadowAlpha = 1 - (i / 40);
            
            circle.style.boxShadow = `3px 0px rgba(255,255,255, ${shadowAlpha}), 6px -5px rgba(10, 0, 0, ${shadowAlpha})`;
            circle.style.width = `${(i * 6)}px`;
            circle.style.height = `${(i * 1)}px`;
            circle.style.right = `${(i * 10)}px`;
            circle.style.bottom = `${(i * 10)}px`;
            circle.style.filter = `blur(${(i / 3 + 8)}px)`;
            circle.style.transformOrigin = `${(i * 4)}px ${(i * 2)}px`;
            circle.style.animation = `spin 3s ${(i / 10)}s linear infinite`;
            circle.style.background = `rgba(${(90 + i * 3)}, ${(33 + i * 1)}, 205, ${alpha})`;
            
            smokeBox.appendChild(circle);
        }

        // TIMER & BACKEND API LOGIC
        let targetTime = 0;
        let timeOffset = 0;
        let remainingAttempts = 3;

        async function fetchServerState() {
            try {
                const res = await fetch('/api/time');
                const data = await res.json();
                
                targetTime = data.targetTimestamp;
                timeOffset = data.serverTime - Date.now();

                const count = data.onlineCount || 106;
                document.getElementById('online-counter').innerText = `${count} Online`;
                
                updateTimer();
            } catch (err) {
                if (!targetTime) targetTime = Date.now() + (9157321 * 1000);
                updateTimer();
            }
        }

        function updateTimer() {
            if (!targetTime) return;

            const now = Date.now() + timeOffset;
            const diff = targetTime - now;

            if (diff <= 0) {
                document.getElementById('seconds-display').innerText = "0";
                document.getElementById('status-text').innerText = "null state reached.";
                return;
            }

            const totalSeconds = Math.floor(diff / 1000);
            document.getElementById('seconds-display').innerText = totalSeconds.toString();
        }

        fetchServerState();
        setInterval(updateTimer, 1000);

        // 12 CODE INPUT BOXES CONTROLLER
        const codeInputs = document.querySelectorAll('.code-box');

        codeInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                input.value = input.value.replace(/[^0-9]/g, ''); // Numbers only
                
                if (input.value.length === 1 && index < codeInputs.length - 1) {
                    codeInputs[index + 1].focus(); // Auto jump to next box
                }

                if (index === codeInputs.length - 1 && input.value.length === 1) {
                    checkSubmission();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && input.value === '' && index > 0) {
                    codeInputs[index - 1].focus();
                }
            });
        });

        function checkSubmission() {
            if (remainingAttempts <= 0) return;

            remainingAttempts--;
            const attemptEl = document.getElementById('attempts-text');
            
            if (remainingAttempts > 0) {
                attemptEl.innerText = `you have ${remainingAttempts} attempts today`;
            } else {
                attemptEl.innerText = `0 attempts remaining // locked until tomorrow`;
                codeInputs.forEach(i => i.disabled = true);
            }
        }

        // EASTER EGG KEYBOARD LISTENER
        let inputBuffer = "";
        const secrets = {
            "TRUTH": () => triggerEasterEgg("TRUTH DETECTED: THERE IS NO ESCAPE", true),
            "GATE": () => triggerEasterEgg("GATEWAY OPENING // LOGS UNLOCKED", false),
            "WAKE": () => triggerEasterEgg("YOU CANNOT WAKE UP", true)
        };

        window.addEventListener('keydown', (e) => {
            if (e.key.length === 1 && e.key.match(/[a-z]/i)) {
                inputBuffer += e.key.toUpperCase();
                if (inputBuffer.length > 10) inputBuffer = inputBuffer.substring(inputBuffer.length - 10);
                
                for (let code in secrets) {
                    if (inputBuffer.endsWith(code)) {
                        secrets[code]();
                        inputBuffer = "";
                    }
                }
            }
        });

        function triggerEasterEgg(message, flashEffect) {
            const statusEl = document.getElementById('status-text');
            statusEl.innerText = message;
            statusEl.style.color = "#ff1a1a";

            if (flashEffect) {
                document.body.classList.add('flash-red');
                setTimeout(() => document.body.classList.remove('flash-red'), 300);
            }
        }
    </script>
</body>
</html>
